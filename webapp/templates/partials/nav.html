<header class="site-header">
  <div class="site-header__inner">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none">
          <rect x="3"  y="12" width="4.5" height="9"  rx="1.2" fill="#fff" opacity=".85"/>
          <rect x="9.75" y="7" width="4.5" height="14" rx="1.2" fill="#fff"/>
          <rect x="16.5" y="3" width="4.5" height="18" rx="1.2" fill="#fff" opacity=".7"/>
        </svg>
      </span>
      <span class="brand__name">{{ app_name }}</span>
    </div>
    <nav class="site-nav">
      {% for item in nav %}
      <a class="site-nav__link{{ ' is-active' if item.endpoint == active else '' }}"
         href="{{ item.url }}">{{ item.label }}</a>
      {% endfor %}
    </nav>

    <details class="theme-menu" id="theme-menu">
      <summary class="theme-menu__btn" id="theme-menu-btn"
               data-mode="system" aria-label="主题偏好" title="主题偏好">
        <svg class="theme-menu__icon theme-menu__icon--sun" viewBox="0 0 24 24" width="16" height="16"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="theme-menu__icon theme-menu__icon--moon" viewBox="0 0 24 24" width="16" height="16"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="theme-menu__icon theme-menu__icon--auto" viewBox="0 0 24 24" width="16" height="16"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="13" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </summary>
      <div class="theme-menu__panel" role="radiogroup" aria-label="主题偏好">
        <label class="theme-menu__opt">
          <input type="radio" name="theme-pref" value="system">跟随系统
        </label>
        <label class="theme-menu__opt">
          <input type="radio" name="theme-pref" value="light">浅色
        </label>
        <label class="theme-menu__opt">
          <input type="radio" name="theme-pref" value="dark">暗色
        </label>
      </div>
    </details>
  </div>
</header>
